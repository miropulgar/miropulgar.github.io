<header class="site-header">
  <a class="nm" href="{{ '/' | relative_url }}">Miroslav Pulgar</a>
  <nav>
    {%- assign nav = "About:/About/,Publications:/publications/,Teaching:/teaching/,Notas:/notas/" | split: "," -%}
    {%- for item in nav -%}
      {%- assign par = item | split: ":" -%}
      <a href="{{ par[1] | relative_url }}"{% if page.url == par[1] %} aria-current="page"{% endif %}>{{ par[0] }}</a>
    {%- endfor -%}
  </nav>
</header>
