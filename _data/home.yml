# Contenido de la portada. Se edita aquí, sin tocar el HTML.

bio: >-
  Investigador postdoctoral en Antropología en la **Universitat Autònoma de Barcelona**
  y miembro de **GRAFO-UAB**. Trabajo con métodos mixtos en cultura y formas relacionales,
  comparación transcultural, y economía, mercados y aprovisionamiento.

# Franjas de conceptos (color: negro, naranja, rosa, gris, lima)
conceptos:
  - nombre: Antropología
    color: negro
  - nombre: Relaciones
    color: naranja
  - nombre: Comparación
    color: rosa
  - nombre: Economía
    color: gris
  - nombre: Medioambiente
    color: lima

# Las tres escenas del bloque azul, en el orden en que aparecen
escenas:
  - titulo: Culturas
    pie: >-
      186 sociedades del Standard Cross-Cultural Sample en el espacio de los cuatro
      modelos relacionales de Fiske. Cultura como composición relacional, GRAFO-UAB, 2026.
  - titulo: Redes personales
    pie: Redes personales del proyecto MapCDPerNets.
  - titulo: Pesca artesanal
    pie: Redes egocéntricas de pescadores en dos regiones de Chile.

proyecto:
  nombre: MapCDPerNets
  texto: Diversidad cultural en redes personales, a escala mundial. Fundación BBVA.
  url: https://mapcdpernets.es
  enlace: mapcdpernets.es

investigacion:
  - Comparación transcultural
  - Redes personales
  - Aprovisionamiento y mercados

