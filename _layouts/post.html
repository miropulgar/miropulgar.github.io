---
layout: default
---
<article class="pagina">
  <header class="cabecera gris">
    <span class="lab">Notas – {% include fecha.html date=page.date largo=true %}</span>
    <h1>{{ page.title }}</h1>
  </header>
  <div class="prose">
    {{ content }}
  </div>
  <nav class="pie-nota">
    {%- if page.previous %}<a href="{{ page.previous.url | relative_url }}">← {{ page.previous.title }}</a>{% else %}<span></span>{% endif -%}
    {%- if page.next %}<a href="{{ page.next.url | relative_url }}">{{ page.next.title }} →</a>{% endif -%}
  </nav>
</article>
